<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bildspel</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 16px system-ui, sans-serif; overflow: hidden; }

  /* Bilderna täcker hela fönstret och behåller proportionerna; kanter beskärs vid behov */
  #stage img {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 0; transition: opacity 1s;
  }
  #stage img.show { opacity: 1; }
  #stage img.zoom { transform: scale(1.1); transition: opacity 1s, transform 7s linear; }

  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center; }
</style>
</head>
<body>

<div id="stage"><img id="a" alt=""><img id="b" alt=""></div>
<div id="msg">Hämtar bilder…</div>

<script>
// ---- Inställningar ----
const REPO    = 'niklasalden/slideshow';   // GitHub-användare/repo
const BRANCH  = 'main';
const FOLDER  = 'images';                  // bildmappen bredvid index.html
const SECONDS = 6;                         // tid per bild
const REFRESH = 5;                         // kolla efter nya/borttagna bilder var 5:e minut

const IMAGE = /\.(jpe?g|png|gif|webp|avif|svg)$/i;
const msg = document.getElementById('msg');

// Hämtar listan med bilder i mappen från GitHub
async function listImages() {
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FOLDER}?ref=${BRANCH}`);
  if (!res.ok) throw new Error(`GitHub svarade ${res.status}`);
  const files = await res.json();
  return files.filter(f => f.type === 'file' && IMAGE.test(f.name)).map(f => f.download_url);
}

// Blandar listan i slumpmässig ordning
function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
}

// Själva bildspelet: två bilder ovanpå varandra som tonas in/ut
const layers = [document.getElementById('a'), document.getElementById('b')];
let images = [], index = 0, front = 0;

async function showNext() {
  if (!images.length) { setTimeout(showNext, SECONDS * 1000); return; }
  if (index === 0) shuffle(images);                  // ny slumpordning varje varv
  const src = images[index];
  index = (index + 1) % images.length;
  try {
    const pre = new Image();
    pre.src = src;
    await pre.decode();                              // vänta tills bilden är laddad
    const back = layers[1 - front];
    back.classList.remove('zoom');
    back.src = src;
    void back.offsetWidth;
    back.classList.add('show', 'zoom');
    layers[front].classList.remove('show');
    front = 1 - front;
  } catch { /* hoppa över bilder som inte går att ladda */ }
  setTimeout(showNext, SECONDS * 1000);
}

// Läser in mappen på nytt; vid fel behålls de bilder vi redan har
async function refresh() {
  try {
    const list = (await listImages()).sort();
    if (list.join() !== [...images].sort().join()) {   // något har ändrats
      images = list;
      index = 0;
    }
    msg.textContent = images.length ? '' : 'Inga bilder i mappen.';
  } catch (err) {
    if (!images.length) msg.textContent = 'Kunde inte hämta bilderna: ' + err.message;
  }
}

refresh().then(showNext);
setInterval(refresh, REFRESH * 60 * 1000);
</script>
</body>
</html>
