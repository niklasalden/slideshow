<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bildspel</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 16px system-ui, sans-serif; overflow: hidden; }

  /* Bilderna fyller fönstret men behåller proportionerna (object-fit: contain) */
  #stage img {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 0; transition: opacity 1s;
  }
  #stage img.show { opacity: 1; }

  #start {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; padding: 16px;
  }
  #start input { width: min(600px, 100%); padding: 10px; font-size: 16px; }
  #start button { padding: 10px 24px; font-size: 16px; cursor: pointer; }
  #msg { color: #f88; min-height: 1.4em; text-align: center; }
</style>
</head>
<body>

<div id="stage"><img id="a" alt=""><img id="b" alt=""></div>

<form id="start">
  <h1>Bildspel</h1>
  <input id="url" placeholder="https://github.com/ägare/repo/tree/main/mapp" required>
  <button>Starta</button>
  <div id="msg"></div>
</form>

<script>
const SECONDS = 6;                                   // tid per bild
const IMAGE = /\.(jpe?g|png|gif|webp|avif|svg)$/i;

// Hämtar listan med bilder från en GitHub-mapp
async function listGithub(link) {
  const m = link.match(/github\.com\/([^/]+)\/([^/]+?)(?:\.git)?(?:\/tree\/([^/]+)\/?(.*))?\/?$/);
  if (!m) throw new Error('Det ser inte ut som en länk till en GitHub-mapp.');
  const [, owner, repo, branch, path = ''] = m;
  let api = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
  if (branch) api += `?ref=${encodeURIComponent(branch)}`;

  const res = await fetch(api);
  if (!res.ok) throw new Error(`GitHub svarade ${res.status}. Är repot publikt och länken rätt?`);
  const files = await res.json();
  if (!Array.isArray(files)) throw new Error('Länken pekar på en fil, inte en mapp.');

  return files
    .filter(f => f.type === 'file' && IMAGE.test(f.name))
    .sort((x, y) => x.name.localeCompare(y.name, 'sv', { numeric: true }))
    .map(f => f.download_url);
}

// Själva bildspelet: två bilder ovanpå varandra som tonas in/ut
const layers = [document.getElementById('a'), document.getElementById('b')];
let images = [], index = 0, front = 0;

async function showNext() {
  const src = images[index];
  index = (index + 1) % images.length;
  try {
    const pre = new Image();
    pre.src = src;
    await pre.decode();                              // vänta tills bilden är laddad
    const back = layers[1 - front];
    back.src = src;
    back.classList.add('show');
    layers[front].classList.remove('show');
    front = 1 - front;
  } catch { /* hoppa över bilder som inte går att ladda */ }
  setTimeout(showNext, SECONDS * 1000);
}

document.getElementById('start').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = 'Hämtar bilder…';
  try {
    images = await listGithub(document.getElementById('url').value.trim());
    if (!images.length) throw new Error('Hittade inga bilder i mappen.');
    e.target.remove();
    showNext();
  } catch (err) {
    msg.textContent = err.message;
  }
});
</script>
</body>
</html>
